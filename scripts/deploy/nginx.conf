map $http_upgrade $newbee_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $newbee_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;

    location /sys-api/        { proxy_pass http://${CORE_API_UPSTREAM}/; }
    location /cmdb-api/       { proxy_pass http://${CMDB_API_UPSTREAM}/; }
    location /io-api/         { proxy_pass http://${IO_API_UPSTREAM}/; }
    location /ops-api/        { proxy_pass http://${OPS_API_UPSTREAM}/; }
    location /ops-center-api/ { proxy_pass http://${OPS_API_UPSTREAM}/; }

    # Optional services are not included in the platform deployment.
    location ~ ^/(fms|ipam|mms)-api/ { return 503; }
    location = /_app.config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
